<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>施設マップ（静的版デモ）</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="bar"><strong>施設マップ（静的版デモ）</strong></header>
<main id="app">
  <p class="note"><strong>自主検証・架空データ。</strong>実務・受託の実績ではありません。ホテル・施設・住所はすべて架空です（地図の中心だけ実在の地域の座標）。この静的版は読み取り専用で、施設データはページに埋め込んだ固定の写しです（PHP・MySQL・API キーは使っていません）。管理画面・取り込み・Google Maps 版は、Docker で動かす本体にあります（<a href="https://github.com/Hide-Saku/google-maps-hotel-demo">リポジトリ</a>）。</p>
  <div class="controls">
    <label>ホテル
      <select id="hotel-select"></select>
    </label>
  </div>
  <fieldset id="categories"><legend>カテゴリ</legend><span id="category-boxes"></span></fieldset>
  <p id="counts" class="counts" aria-live="polite">読み込み中…</p>
  <p id="map-error" class="errors" role="alert" hidden></p>
  <div id="map" role="region" aria-label="施設の地図"></div>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
